spring.application.name=onboarding-tracker
server.port=8080

# Embedded H2 (file-based so data survives restarts; use jdbc:h2:mem:onboardingdb for in-memory only)
spring.datasource.url=jdbc:h2:file:./data/onboardingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
